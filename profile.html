<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile – IlhamStore</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#065F46">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://drive.google.com https://*.googleusercontent.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com;">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/ilhamstore.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;background:#F1F5F9;min-height:100vh;display:flex;flex-direction:column;color:#1E293B}
    input{-webkit-user-select:text;user-select:text}
    input:disabled{opacity:.6;cursor:not-allowed}
    .hero{background:linear-gradient(135deg,#064E3B,#065F46 60%,#059669);padding:18px 16px 74px}
    .htop{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
    .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
    .logo img{width:36px;height:36px;border-radius:9px}
    .logo b{font-weight:800;font-size:1.1rem}.logo b span{color:#6EE7B7}
    .hbtns{display:flex;gap:8px}
    .hbtn{color:#fff;text-decoration:none;font-weight:600;font-size:.8rem;background:rgba(255,255,255,.12);padding:9px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.2);transition:.2s}
    .hbtn:hover{background:rgba(255,255,255,.24)}
    .ucard{max-width:860px;margin:-56px auto 0;padding:0 16px;position:relative;z-index:2}
    .uc{background:#fff;border-radius:20px;box-shadow:0 12px 36px rgba(15,23,42,.12);padding:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
    .avwrap{position:relative;width:76px;height:76px;flex-shrink:0;cursor:pointer}
    .avatar{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#059669,#065F46);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:900;overflow:hidden;box-shadow:0 6px 18px rgba(6,95,70,.35)}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .cam{position:absolute;bottom:-2px;right:-2px;width:27px;height:27px;border-radius:50%;background:#1E293B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.66rem;border:3px solid #fff}
    .uc-info{flex:1;min-width:200px}
    .uc-info h1{font-size:1.25rem;font-weight:800}
    .uc-info .em{font-size:.84rem;color:#64748B;margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .uc-info .em i{color:#059669;font-size:.72rem}
    .uc-stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .stat{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:6px 12px;font-size:.7rem;font-weight:700;color:#475569}
    .stat b{color:#065F46;font-weight:900}
    .lout{background:#FEE2E2;color:#B91C1C;border:none;padding:12px 20px;border-radius:12px;font-weight:800;font-size:.84rem;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px}
    .lout:hover{background:#FECACA}
    .wrap{max-width:860px;margin:0 auto;padding:20px 16px 44px;width:100%}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
    .card{background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(15,23,42,.07);overflow:hidden;margin-bottom:20px}
    .chead{padding:15px 20px;font-size:.92rem;font-weight:800;display:flex;align-items:center;gap:9px;border-bottom:1px solid #F1F5F9}
    .chead i{color:#059669;font-size:.85rem}
    .cbody{padding:20px}
    .fld{margin-bottom:14px}
    .fld label{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;color:#475569;margin-bottom:6px}
    .fld label i{color:#059669;font-size:.68rem}
    .iw{position:relative}
    .iw>i.lead{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94A3B8;font-size:.88rem}
    .iw input{width:100%;padding:12px 42px 12px 40px;border:1.5px solid #E2E8F0;border-radius:12px;font-size:.9rem;font-family:inherit;outline:none;background:#F8FAFC;transition:.2s}
    .iw input:focus{border-color:#059669;background:#fff;box-shadow:0 0 0 3px rgba(5,150,105,.1)}
    .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94A3B8;cursor:pointer;padding:8px}
    .btn{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#059669,#065F46);color:#fff;font-weight:800;font-size:.9rem;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
    .btn:hover{transform:translateY(-1px)}
    .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .btn.warn{background:linear-gradient(135deg,#D97706,#B45309)}
    .divider{height:1px;background:#F1F5F9;margin:18px 0}
    .dv-label{font-size:.72rem;font-weight:800;color:#94A3B8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;gap:6px}
    .bn{display:none;align-items:flex-start;gap:9px;border-radius:11px;padding:10px 13px;font-size:.76rem;line-height:1.5;margin-bottom:14px}
    .bn.show{display:flex}
    .bn.ok{background:#ECFDF5;border:1px solid #6EE7B7;color:#065F46}
    .bn.err{background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C}
    .bn i{margin-top:2px}
    .hint{font-size:.68rem;color:#94A3B8;margin-top:-8px;margin-bottom:12px}
    .oi{border:1px solid #E2E8F0;border-radius:14px;padding:13px 15px;margin-bottom:10px}
    .oi-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
    .oi-top b{font-size:.86rem;font-family:monospace}
    .badge{padding:5px 12px;border-radius:30px;font-size:.6rem;font-weight:800;text-transform:uppercase}
    .badge.verifying{background:#FEF3C7;color:#92400E}.badge.pending{background:#E2E8F0;color:#475569}
    .badge.confirmed,.badge.completed,.badge.delivered{background:#D1FAE5;color:#065F46}
    .badge.rejected,.badge.cancelled,.badge.fraud{background:#FEE2E2;color:#B91C1C}
    .badge.refunded{background:#DBEAFE;color:#1E40AF}
    .oi-meta{font-size:.78rem;color:#64748B;line-height:1.6}
    .oi-meta b{color:#1E293B}
    .rv{border:1px solid #E2E8F0;border-radius:14px;padding:13px 15px;margin-bottom:10px}
    .rv-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
    .rv-top b{font-size:.85rem}
    .stars{color:#F59E0B;font-size:.8rem;letter-spacing:2px}
    .stars .off{color:#E5E7EB}
    .rv-status{font-size:.58rem;font-weight:800;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-left:auto}
    .rv-status.pending{background:#FEF3C7;color:#92400E}.rv-status.approved{background:#D1FAE5;color:#065F46}.rv-status.rejected{background:#FEE2E2;color:#B91C1C}
    .rv-txt{font-size:.8rem;color:#475569;margin-top:4px;line-height:1.55}
    .rv-date{font-size:.66rem;color:#94A3B8;margin-top:5px}
    .empty{text-align:center;color:#94A3B8;font-size:.84rem;padding:16px}
    .empty a{color:#065F46;font-weight:800}
    .foot{background:#065F46;color:#D1FAE5;text-align:center;padding:15px;font-size:.8rem;margin-top:auto}
    .foot a{color:#6EE7B7;text-decoration:none;font-weight:600}
    .load{text-align:center;padding:50px 16px;color:#065F46;font-weight:700}
    .sp{width:30px;height:30px;border:3px solid #D1FAE5;border-top-color:#059669;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
    @keyframes sp{to{transform:rotate(360deg)}}
    .tw{position:fixed;top:18px;right:18px;z-index:999;display:flex;flex-direction:column;gap:10px}
    .toast{background:#1E293B;color:#fff;padding:12px 16px;border-radius:12px;font-size:.86rem;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px}
    .toast.error{background:#B91C1C}.toast.success{background:#065F46}
    @media(max-width:680px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>

  <div class="hero">
    <div class="htop">
      <a href="index.html" class="logo"><img src="images/ilhamstore.png" alt="" onerror="this.style.display='none'"><b>Ilham<span>Store</span></b></a>
      <div class="hbtns">
        <a href="track.html" class="hbtn"><i class="fas fa-truck-fast"></i> Track</a>
        <a href="index.html" class="hbtn"><i class="fas fa-store"></i> Store</a>
      </div>
    </div>
  </div>

  <div class="ucard" id="ucard"><div class="uc"><div class="load" style="padding:4px 26px;"><div class="sp"></div>Loading profile...</div></div></div>

  <div class="wrap" id="wrap" style="display:none;">

    <div class="grid">
      <!-- EDIT PROFILE -->
      <div class="card">
        <div class="chead"><i class="fas fa-user-pen"></i> Edit Profile</div>
        <div class="cbody">
          <div class="bn" id="bnSave"><i class="fas fa-circle-check"></i><span></span></div>
          <div class="fld"><label><i class="fas fa-id-badge"></i> Full Name</label>
            <div class="iw"><i class="fas fa-id-badge lead"></i><input type="text" id="inName" maxlength="60"></div></div>
          <div class="fld"><label><i class="fas fa-phone"></i> Phone Number</label>
            <div class="iw"><i class="fas fa-phone lead"></i><input type="tel" id="inPhone" placeholder="01XXXXXXXXX" maxlength="11"></div></div>
          <p class="hint"><i class="fas fa-camera"></i> Profile photo change করতে উপরের ছবিতে click করুন, তারপর Save Changes চাপুন।</p>
          <button class="btn" id="btnSave" onclick="saveProfile()" disabled><i class="fas fa-floppy-disk"></i> Save Changes</button>
        </div>
      </div>

      <!-- SECURITY -->
      <div class="card">
        <div class="chead"><i class="fas fa-shield-halved"></i> Account Security</div>
        <div class="cbody">
          <div class="bn" id="bnEmail"><i class="fas fa-circle-check"></i><span></span></div>
          <div class="dv-label"><i class="fas fa-envelope" style="color:#2563EB;"></i> Change Email</div>
          <div class="fld"><label><i class="fas fa-envelope"></i> New Email</label>
            <div class="iw"><i class="fas fa-envelope lead"></i><input type="email" id="inNewEmail" placeholder="new@email.com"></div></div>
          <div class="fld"><label><i class="fas fa-lock"></i> Current Password (confirm)</label>
            <div class="iw"><i class="fas fa-lock lead"></i><input type="password" id="inEmailPass">
              <button type="button" class="eye" onclick="eyeToggle('inEmailPass',this)"><i class="fas fa-eye"></i></button></div></div>
          <button class="btn" id="btnEmail" style="background:linear-gradient(135deg,#2563EB,#1E40AF);" onclick="changeEmail()" disabled><i class="fas fa-envelope"></i> Update Email</button>

          <div class="divider"></div>

          <div class="bn" id="bnPass"><i class="fas fa-circle-check"></i><span></span></div>
          <div class="dv-label"><i class="fas fa-key" style="color:#D97706;"></i> Change Password</div>
          <div class="fld"><label><i class="fas fa-lock"></i> Current Password</label>
            <div class="iw"><i class="fas fa-lock lead"></i><input type="password" id="inOldPass">
              <button type="button" class="eye" onclick="eyeToggle('inOldPass',this)"><i class="fas fa-eye"></i></button></div></div>
          <div class="fld"><label><i class="fas fa-lock"></i> New Password</label>
            <div class="iw"><i class="fas fa-lock lead"></i><input type="password" id="inNewPass" placeholder="Min 6 characters">
              <button type="button" class="eye" onclick="eyeToggle('inNewPass',this)"><i class="fas fa-eye"></i></button></div></div>
          <div class="fld"><label><i class="fas fa-lock"></i> Confirm New Password</label>
            <div class="iw"><i class="fas fa-lock lead"></i><input type="password" id="inNewPass2">
              <button type="button" class="eye" onclick="eyeToggle('inNewPass2',this)"><i class="fas fa-eye"></i></button></div></div>
          <button class="btn warn" id="btnPass" onclick="changePass()" disabled><i class="fas fa-key"></i> Update Password</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="chead"><i class="fas fa-box"></i> My Orders <span id="ordCount" style="font-size:.7rem;color:#94A3B8;font-weight:700;"></span></div>
      <div class="cbody" id="ordList"></div>
    </div>

    <div class="card">
      <div class="chead"><i class="fas fa-star" style="color:#F59E0B;"></i> My Reviews <span id="rvCount" style="font-size:.7rem;color:#94A3B8;font-weight:700;"></span></div>
      <div class="cbody" id="rvList"></div>
    </div>

  </div>

  <div class="foot">&copy; <span id="yr"></span> <a href="index.html">IlhamStore.com</a> — All rights reserved.</div>

  <input type="file" id="avInput" accept="image/*" style="display:none;" onchange="pickAvatar(this)">
  <div class="tw" id="tw"></div>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

const _0x4f8a = 'aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J5Y2U4aWlXYkF5TzVLM0E1SVpHa0NuaFQxOF82ZFM5c1daWjhObHI0cm5MeHduTjZsMFR4aEtGb21TVENDend4cXkvZXhlYw==';    var GAS_URL = atob(_0x4f8a);
    var SECRET = 'ILHS_SECRET_2025_X9K2M';

    var session = null;
    try { session = JSON.parse(localStorage.getItem('ilham_session') || 'null'); } catch(e){}
    if(!session || !session.token){ window.location.href = 'login.html'; }

    var pendingAvatar = null; // null = no change, string = new photo (base64)
    var savedName = '';
    var savedPhone = '';
    var profileSaving = false;
    var emailUpdating = false;
    var passwordUpdating = false;

    function normalizePhone(value){
      var phone = (value || '').toString().trim().replace(/[\s\-]/g, '');
      if(phone.length === 10 && /^1[3-9]\d{8}$/.test(phone)) phone = '0' + phone;
      return phone;
    }
    function updateSaveButton(){
      var name = document.getElementById('inName').value.trim();
      var phone = normalizePhone(document.getElementById('inPhone').value);
      document.getElementById('btnSave').disabled = profileSaving || (name === savedName && phone === savedPhone && pendingAvatar === null);
    }
    function updateEmailButton(){
      var email = document.getElementById('inNewEmail');
      var password = document.getElementById('inEmailPass').value;
      document.getElementById('btnEmail').disabled = emailUpdating || !email.value.trim() || !email.checkValidity() || !password;
    }
    function updatePasswordButton(){
      var current = document.getElementById('inOldPass').value;
      var next = document.getElementById('inNewPass').value;
      var confirm = document.getElementById('inNewPass2').value;
      document.getElementById('btnPass').disabled = passwordUpdating || !current || next.length < 6 || next !== confirm;
    }

    function esc(s){ return (s === null || s === undefined ? '' : s).toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function toast(m, t){
      t = t || '';
      var w = document.getElementById('tw');
      var x = document.createElement('div');
      x.className = 'toast ' + t;
      x.innerHTML = '<i class="fas ' + (t === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check') + '"></i> ' + m;
      w.appendChild(x);
      setTimeout(function(){ x.remove(); }, 3200);
    }
    function bn(id, ok, txt){
      var b = document.getElementById(id);
      b.className = 'bn show ' + (ok ? 'ok' : 'err');
      b.querySelector('i').className = 'fas ' + (ok ? 'fa-circle-check' : 'fa-circle-exclamation');
      b.querySelector('span').textContent = txt;
    }
    function bnHide(id){ document.getElementById(id).className = 'bn'; }
    function eyeToggle(id, btn){
      var i = document.getElementById(id);
      i.type = (i.type === 'password') ? 'text' : 'password';
      btn.innerHTML = (i.type === 'password') ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    }
    function bc(s){
      s = (s || '').toLowerCase();
      if(s.indexOf('confirm') !== -1 || s.indexOf('complet') !== -1 || s.indexOf('deliver') !== -1) return 'confirmed';
      if(s.indexOf('verify') !== -1) return 'verifying';
      if(s.indexOf('reject') !== -1 || s.indexOf('cancel') !== -1 || s.indexOf('fraud') !== -1) return 'rejected';
      if(s.indexOf('refund') !== -1) return 'refunded';
      return 'pending';
    }
    function stars(n){
      var h = '';
      for(var i = 1; i <= 5; i++){ h += '<i class="fas fa-star ' + (i <= n ? '' : 'off') + '"></i>'; }
      return h;
    }
    function renderAvatar(src, name){
      var el = document.getElementById('avImg');
      if(src){ el.innerHTML = '<img src="' + src + '" alt="">'; }
      else { el.textContent = (name || 'U').charAt(0).toUpperCase(); }
    }

    /* ===== LOAD PROFILE ===== */
    async function load(){
      try{
        if(session.name){
          document.getElementById('ucard').innerHTML = '<div class="uc"><div class="avwrap"><div class="avatar">' + (session.avatar ? '<img src="' + session.avatar + '" alt="">' : (session.name || 'U').charAt(0).toUpperCase()) + '</div></div><div class="uc-info"><h1>' + esc(session.name) + '</h1><div class="em"><i class="fas fa-spinner fa-spin"></i> Loading details...</div></div></div>';
        }
        var r = await (await fetch(GAS_URL + '?secret=' + encodeURIComponent(SECRET) + '&action=get_profile&token=' + encodeURIComponent(session.token))).json();
        if(r.result !== 'success'){
          localStorage.removeItem('ilham_session');
          window.location.href = 'login.html';
          return;
        }
        var u = r.user;
        session.name = u.name || session.name;
        if(u.avatar){ session.avatar = u.avatar; }
        else { delete session.avatar; }
        localStorage.setItem('ilham_session', JSON.stringify(session));

        document.getElementById('ucard').innerHTML =
          '<div class="uc">' +
            '<div class="avwrap" onclick="document.getElementById(\'avInput\').click()" title="Click to change photo">' +
              '<div class="avatar" id="avImg"></div>' +
              '<div class="cam"><i class="fas fa-camera"></i></div>' +
            '</div>' +
            '<div class="uc-info">' +
              '<h1 id="pfTitle">' + esc(u.name) + '</h1>' +
              '<div class="em"><i class="fas fa-envelope"></i> ' + esc(u.email) + (u.phone ? ' &nbsp;·&nbsp; <i class="fas fa-phone"></i> ' + esc(u.phone) : '') + '</div>' +
              '<div class="uc-stats">' +
                '<span class="stat"><i class="fas fa-box" style="color:#059669;"></i> Orders: <b>' + (r.orders || []).length + '</b></span>' +
                '<span class="stat"><i class="fas fa-star" style="color:#F59E0B;"></i> Reviews: <b>' + (r.reviews || []).length + '</b></span>' +
                '<span class="stat"><i class="fas fa-calendar"></i> Since: <b>' + esc((u.joined || '').split(' ').slice(0, 3).join(' ') || '—') + '</b></span>' +
              '</div>' +
            '</div>' +
            '<button class="lout" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</button>' +
          '</div>';

        renderAvatar(u.avatar, u.name);
        document.getElementById('inName').value = u.name || '';
        var ph = (u.phone || '').toString().replace(/[\s\-]/g,'');
if(ph.length === 10 && /^1[3-9]\d{8}$/.test(ph)) ph = '0' + ph;
document.getElementById('inPhone').value = ph;
      savedName = document.getElementById('inName').value.trim();
      savedPhone = normalizePhone(ph);
      updateSaveButton();

        var oc = (r.orders || []).length;
        document.getElementById('ordCount').textContent = oc ? '(' + oc + ')' : '';
        document.getElementById('ordList').innerHTML = oc
          ? r.orders.map(function(o){
              return '<div class="oi"><div class="oi-top"><b>#' + esc(o.orderId) + '</b><span class="badge ' + bc(o.status) + '">' + esc(o.status) + '</span></div>' +
                     '<div class="oi-meta"><b>' + esc(o.product) + '</b> — ' + esc(o.pkg) + ' · ৳' + esc(o.total) + ' · ' + esc(o.date) + '</div></div>';
            }).join('')
          : '<div class="empty">No orders yet. <a href="index.html">Start shopping &rarr;</a></div>';

        var rc = (r.reviews || []).length;
        document.getElementById('rvCount').textContent = rc ? '(' + rc + ')' : '';
        document.getElementById('rvList').innerHTML = rc
          ? r.reviews.map(function(rv){
              return '<div class="rv"><div class="rv-top"><b>' + esc(rv.productName) + '</b><span class="rv-status ' + (rv.status || 'pending').toLowerCase() + '">' + esc(rv.status) + '</span></div>' +
                     '<div class="stars">' + stars(rv.stars) + '</div>' +
                     (rv.comment ? '<div class="rv-txt">' + esc(rv.comment) + '</div>' : '') +
                     '<div class="rv-date"><i class="fas fa-clock"></i> ' + esc(rv.date) + '</div></div>';
            }).join('')
          : '<div class="empty">No reviews yet. Buy something and share your experience!</div>';

        document.getElementById('wrap').style.display = 'block';
      }catch(e){
        document.getElementById('ucard').innerHTML = '<div class="uc"><div class="load" style="padding:4px 26px;">Server error. <a href="profile.html" style="color:#065F46;">Retry</a></div></div>';
      }
    }

    /* ===== PROFILE PHOTO: pick + resize + preview ===== */
    function pickAvatar(input){
      var file = input.files && input.files[0];
      if(!file) return;
      if(!file.type || file.type.indexOf('image/') !== 0){ toast('Please choose an image file', 'error'); return; }
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var size = 200;
          var c = document.createElement('canvas');
          c.width = size; c.height = size;
          var ctx = c.getContext('2d');
          var min = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, size, size);
          pendingAvatar = c.toDataURL('image/jpeg', 0.72);
          renderAvatar(pendingAvatar, session.name);
          updateSaveButton();
          toast('Photo ready — now press Save Changes', 'success');
        };
        img.onerror = function(){ toast('Could not read that image', 'error'); };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    /* ===== SAVE PROFILE (name + phone + avatar) ===== */
    async function saveProfile(){
      var name = document.getElementById('inName').value.trim();
      var phone = normalizePhone(document.getElementById('inPhone').value);
      if(!name){ bn('bnSave', false, 'Name cannot be empty.'); return; }
      if(phone && !/^01[3-9]\d{8}$/.test(phone)){ bn('bnSave', false, 'Enter a valid 11-digit phone (01XXXXXXXXX).'); return; }
      bnHide('bnSave');

      var btn = document.getElementById('btnSave');
      profileSaving = true;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

      var payload = { secret: SECRET, action: 'update_profile', token: session.token, name: name, phone: phone };
      if(pendingAvatar !== null){ payload.avatar = pendingAvatar; }

      try{
        var r = await (await fetch(GAS_URL, { method:'POST', body: JSON.stringify(payload) })).json();
        if(r.result === 'success'){
          session.name = r.name || name;
          if(r.avatar !== undefined && r.avatar !== null){ session.avatar = r.avatar; }
          localStorage.setItem('ilham_session', JSON.stringify(session));
          document.getElementById('pfTitle').textContent = session.name;
          renderAvatar(session.avatar, session.name);
          pendingAvatar = null;
          savedName = session.name.trim();
          savedPhone = normalizePhone(phone);
          bn('bnSave', true, 'Profile updated successfully.');
          toast('Profile updated!', 'success');
        } else {
          bn('bnSave', false, r.message || 'Update failed.');
        }
      }catch(e){
        bn('bnSave', false, 'Server error. Please try again.');
      }
      profileSaving = false;
      updateSaveButton();
      btn.innerHTML = '<i class="fas fa-floppy-disk"></i> Save Changes';
    }

    document.getElementById('inName').addEventListener('input', updateSaveButton);
    document.getElementById('inPhone').addEventListener('input', updateSaveButton);
    document.getElementById('inName').addEventListener('change', updateSaveButton);
    document.getElementById('inPhone').addEventListener('change', updateSaveButton);
    ['inNewEmail', 'inEmailPass'].forEach(function(id){
      document.getElementById(id).addEventListener('input', updateEmailButton);
      document.getElementById(id).addEventListener('change', updateEmailButton);
    });
    ['inOldPass', 'inNewPass', 'inNewPass2'].forEach(function(id){
      document.getElementById(id).addEventListener('input', updatePasswordButton);
      document.getElementById(id).addEventListener('change', updatePasswordButton);
    });

    /* ===== CHANGE EMAIL ===== */
    async function changeEmail(){
      var ne = document.getElementById('inNewEmail').value.trim();
      var pw = document.getElementById('inEmailPass').value;
      if(!ne){ bn('bnEmail', false, 'Enter your new email address.'); return; }
      if(!pw){ bn('bnEmail', false, 'Enter your current password to confirm.'); return; }
      bnHide('bnEmail');

      var btn = document.getElementById('btnEmail');
      emailUpdating = true;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

      try{
        var r = await (await fetch(GAS_URL, { method:'POST', body: JSON.stringify({ secret: SECRET, action:'change_email', token: session.token, newEmail: ne, password: pw }) })).json();
        if(r.result === 'success'){
          session.email = r.email || ne;
          localStorage.setItem('ilham_session', JSON.stringify(session));
          document.getElementById('inNewEmail').value = '';
          document.getElementById('inEmailPass').value = '';
          bn('bnEmail', true, 'Email updated successfully. Next login e new email use korben.');
          toast('Email updated!', 'success');
          load();
        } else {
          bn('bnEmail', false, r.message || 'Update failed.');
        }
      }catch(e){
        bn('bnEmail', false, 'Server error. Please try again.');
      }
      emailUpdating = false;
      updateEmailButton();
      btn.innerHTML = '<i class="fas fa-envelope"></i> Update Email';
    }

    /* ===== CHANGE PASSWORD ===== */
    async function changePass(){
      var o = document.getElementById('inOldPass').value;
      var n = document.getElementById('inNewPass').value;
      var n2 = document.getElementById('inNewPass2').value;
      if(!o){ bn('bnPass', false, 'Enter your current password.'); return; }
      if(n.length < 6){ bn('bnPass', false, 'New password must be at least 6 characters.'); return; }
      if(n !== n2){ bn('bnPass', false, 'New passwords do not match.'); return; }
      bnHide('bnPass');

      var btn = document.getElementById('btnPass');
      passwordUpdating = true;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

      try{
        var r = await (await fetch(GAS_URL, { method:'POST', body: JSON.stringify({ secret: SECRET, action:'change_password', token: session.token, oldPassword: o, newPassword: n }) })).json();
        if(r.result === 'success'){
          bn('bnPass', true, 'Password changed successfully.');
          toast('Password changed!', 'success');
          document.getElementById('inOldPass').value = '';
          document.getElementById('inNewPass').value = '';
          document.getElementById('inNewPass2').value = '';
        } else {
          bn('bnPass', false, r.message || 'Change failed.');
        }
      }catch(e){
        bn('bnPass', false, 'Server error. Please try again.');
      }
      passwordUpdating = false;
      updatePasswordButton();
      btn.innerHTML = '<i class="fas fa-key"></i> Update Password';
    }

    function logout(){
      localStorage.removeItem('ilham_session');
      window.location.href = 'index.html';
    }

    load();
  </script>
